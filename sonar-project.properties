# =============================================================================
# SonarCloud Project Configuration — CRM Solution
# =============================================================================
# Organization and project key are configured via GitHub Secrets:
#   SONAR_TOKEN  — SonarCloud user token (required)
#
# Project key and org are set via the dotnet-sonarscanner CLI in ci-cd.yml.
# This file configures the JavaScript/TypeScript scanner side of the analysis.
# =============================================================================

sonar.projectKey=alal76_crm-solution
sonar.organization=alal76
sonar.projectName=CRM Solution
sonar.projectVersion=0.600.21

# Ignore rules — suppress false positives for CI/CD credentials and deployment configs
# CI workflows use ephemeral credentials for GitHub Actions service containers (not production)
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,h1,h2,h3,h4,h5,h6,h7,h8,h9,h10,h11,h12,h13,h14,h15,h16

# --- Secrets: CI/CD and infrastructure files contain intentional dev credentials ---
sonar.issue.ignore.multicriteria.e1.ruleKey=secrets:*
sonar.issue.ignore.multicriteria.e1.resourceKey=.github/workflows/**
sonar.issue.ignore.multicriteria.e2.ruleKey=secrets:*
sonar.issue.ignore.multicriteria.e2.resourceKey=docker/**
sonar.issue.ignore.multicriteria.e3.ruleKey=secrets:*
sonar.issue.ignore.multicriteria.e3.resourceKey=kubernetes/**
sonar.issue.ignore.multicriteria.e4.ruleKey=secrets:*
sonar.issue.ignore.multicriteria.e4.resourceKey=scripts/**

# --- S6444: "Using Kestrel without HTTPS" — App runs behind Nginx reverse proxy in production ---
sonar.issue.ignore.multicriteria.h1.ruleKey=csharpsquid:S6444
sonar.issue.ignore.multicriteria.h1.resourceKey=**/*

# --- S5332: "Using clear-text protocols" — Internal service-to-service communication in Docker/K8s ---
sonar.issue.ignore.multicriteria.h2.ruleKey=csharpsquid:S5332
sonar.issue.ignore.multicriteria.h2.resourceKey=**/*
sonar.issue.ignore.multicriteria.h3.ruleKey=typescript:S5332
sonar.issue.ignore.multicriteria.h3.resourceKey=**/*
sonar.issue.ignore.multicriteria.h4.ruleKey=javascript:S5332
sonar.issue.ignore.multicriteria.h4.resourceKey=**/*

# --- S2245: "Using pseudorandom number generators" — Used for UI/non-security purposes ---
sonar.issue.ignore.multicriteria.h5.ruleKey=csharpsquid:S2245
sonar.issue.ignore.multicriteria.h5.resourceKey=**/*
sonar.issue.ignore.multicriteria.h6.ruleKey=typescript:S2245
sonar.issue.ignore.multicriteria.h6.resourceKey=**/*

# --- S2068: "Hard-coded credentials" — Config key references (e.g. "Password" in connection strings),
#     dev/test seed fixtures, and DatabaseSeeder/Initializer — not production credentials ---
sonar.issue.ignore.multicriteria.h7.ruleKey=csharpsquid:S2068
sonar.issue.ignore.multicriteria.h7.resourceKey=**/*
sonar.issue.ignore.multicriteria.h8.ruleKey=typescript:S2068
sonar.issue.ignore.multicriteria.h8.resourceKey=**/*
sonar.issue.ignore.multicriteria.h9.ruleKey=javascript:S2068
sonar.issue.ignore.multicriteria.h9.resourceKey=**/*
sonar.issue.ignore.multicriteria.h10.ruleKey=json:S2068
sonar.issue.ignore.multicriteria.h10.resourceKey=**/*

# --- S4036: "Path injection" — Controlled internal paths, not user input ---
sonar.issue.ignore.multicriteria.h11.ruleKey=csharpsquid:S4036
sonar.issue.ignore.multicriteria.h11.resourceKey=**/*

# --- S5852: "Using regular expressions is security-sensitive" — Validated patterns in validators ---
sonar.issue.ignore.multicriteria.h12.ruleKey=typescript:S5852
sonar.issue.ignore.multicriteria.h12.resourceKey=**/*

# --- shell:S5332: "Using clear-text protocols" — Dev shell scripts use HTTP for internal services ---
sonar.issue.ignore.multicriteria.h13.ruleKey=shell:S5332
sonar.issue.ignore.multicriteria.h13.resourceKey=**/*

# --- xml:S5734 + xml:S3330: Web.config security headers — Handled at Nginx/reverse-proxy level ---
sonar.issue.ignore.multicriteria.h14.ruleKey=xml:S5734
sonar.issue.ignore.multicriteria.h14.resourceKey=**/*
sonar.issue.ignore.multicriteria.h15.ruleKey=xml:S3330
sonar.issue.ignore.multicriteria.h15.resourceKey=**/*

# --- python:S2245: "Using pseudorandom number generators" — Non-security use in scripts ---
sonar.issue.ignore.multicriteria.h16.ruleKey=python:S2245
sonar.issue.ignore.multicriteria.h16.resourceKey=**/*

# Source directories — core application code only (infrastructure analyzed via CI/CD)
# NOTE: .github/workflows excluded from sources as it contains intentional CI test credentials
# for ephemeral GitHub Actions environments (not production secrets)
sonar.sources=CRM.Backend/src,CRM.Frontend/src

# Exclusions — generated code, dependencies, migrations, and TEST DATA files
# Test/e2e/seed files contain intentional hardcoded credentials (dev fixtures) and are not production code
sonar.exclusions=\
  **/node_modules/**,\
  **/obj/**,\
  **/bin/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/migrations/**,\
  **/publish/**,\
  **/*.min.js,\
  **/*.generated.cs,\
  e2e-tests/**,\
  database/seed/**,\
  scripts/data-loader/**,\
  CRM.Backend/tests/**,\
  .github/workflows/**

sonar.test.inclusions=\
  CRM.Backend/tests/**/*.cs,\
  CRM.Frontend/src/**/*.spec.ts,\
  CRM.Frontend/src/**/*.test.tsx,\
  CRM.Frontend/src/**/*.test.ts

sonar.coverage.exclusions=\
  **/tests/**,\
  **/Tests/**,\
  **/*.spec.ts,\
  **/*.test.tsx,\
  **/*.test.ts,\
  **/Program.cs,\
  **/Migrations/**

# .NET (C#) coverage — OpenCover/Cobertura format output by dotnet test
sonar.cs.opencover.reportsPaths=CRM.Backend/tests/TestResults/**/coverage.cobertura.xml

# JavaScript / TypeScript coverage (lcov output from Jest)
sonar.javascript.lcov.reportPaths=CRM.Frontend/coverage/lcov.info
sonar.typescript.lcov.reportPaths=CRM.Frontend/coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# CRM Solution - Pluggable Provider Services
# Phase 2 Week 9: Adds optional self-hosted provider services
# Phase 3 Week 12: Added Chatwoot for live chat
# Phase 4 Week 17: Added DocuSeal for e-signatures
# Phase 5 Week 21: Added Apache Superset for analytics
# 
# Usage: docker-compose -f docker-compose.yml -f docker-compose.providers.yml up -d
#
# These services are OPTIONAL and only needed when:
# - You want to use external providers instead of BuiltIn
# - You prefer self-hosted over SaaS alternatives

volumes:
  novu-data:
  novu-mongo-data:
  novu-redis-data:
  chatwoot-data:
  chatwoot-redis-data:
  chatwoot-postgres-data:
  docuseal-data:
  docuseal-postgres-data:
  superset-data:
  superset-postgres-data:
  superset-redis-data:

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # NOVU - Self-Hosted Notification Infrastructure
  # https://novu.co - Multi-channel notification management
  # ═══════════════════════════════════════════════════════════════════════════
  
  # Novu API (Main service)
  novu-api:
    image: ghcr.io/novuhq/novu/api:0.24.0
    container_name: crm-novu-api
    depends_on:
      novu-mongo:
        condition: service_healthy
      novu-redis:
        condition: service_healthy
    environment:
      - NODE_ENV=local
      - API_ROOT_URL=http://localhost:3000
      - MONGO_URL=mongodb://novu-mongo:27017/novu
      - REDIS_HOST=novu-redis
      - REDIS_PORT=6379
      - REDIS_DB_INDEX=2
      - S3_LOCAL_STACK=http://localhost:9000
      - S3_BUCKET_NAME=novu-local
      - S3_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=novulocalaccesskey00
      - AWS_SECRET_ACCESS_KEY=novulocalsecretkey0000000000000
      - FRONT_BASE_URL=http://localhost:4200
      - API_PORT=3000
      - JWT_SECRET=${NOVU_JWT_SECRET:-your-jwt-secret-change-in-production}
      - STORE_ENCRYPTION_KEY=${NOVU_ENCRYPTION_KEY:-novuEncryptionKey00000000000032c}
    ports:
      - "${NOVU_API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/v1/health-check"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - crm-network

  # Novu Worker (Processes notification jobs)
  novu-worker:
    image: ghcr.io/novuhq/novu/worker:0.24.0
    container_name: crm-novu-worker
    depends_on:
      novu-mongo:
        condition: service_healthy
      novu-redis:
        condition: service_healthy
      novu-api:
        condition: service_healthy
    environment:
      - NODE_ENV=local
      - MONGO_URL=mongodb://novu-mongo:27017/novu
      - REDIS_HOST=novu-redis
      - REDIS_PORT=6379
      - REDIS_DB_INDEX=2
      - S3_LOCAL_STACK=http://localhost:9000
      - AWS_ACCESS_KEY_ID=novulocalaccesskey00
      - AWS_SECRET_ACCESS_KEY=novulocalsecretkey0000000000000
      - STORE_ENCRYPTION_KEY=${NOVU_ENCRYPTION_KEY:-novuEncryptionKey00000000000032c}
    networks:
      - crm-network

  # Novu Web Dashboard (Optional - for managing workflows/templates)
  novu-web:
    image: ghcr.io/novuhq/novu/web:0.24.0
    container_name: crm-novu-web
    depends_on:
      novu-api:
        condition: service_healthy
    environment:
      - REACT_APP_API_URL=http://localhost:3000
      - REACT_APP_WS_URL=http://localhost:3002
      - REACT_APP_WIDGET_EMBED_PATH=http://localhost:4701/embed.umd.min.js
    ports:
      - "${NOVU_WEB_PORT:-4200}:4200"
    networks:
      - crm-network

  # Novu Widget (In-app notification center)
  novu-widget:
    image: ghcr.io/novuhq/novu/widget:0.24.0
    container_name: crm-novu-widget
    depends_on:
      novu-api:
        condition: service_healthy
    environment:
      - REACT_APP_API_URL=http://localhost:3000
      - REACT_APP_WS_URL=http://localhost:3002
    ports:
      - "${NOVU_WIDGET_PORT:-4701}:4701"
    networks:
      - crm-network

  # Novu WebSocket Service
  novu-ws:
    image: ghcr.io/novuhq/novu/ws:0.24.0
    container_name: crm-novu-ws
    depends_on:
      novu-mongo:
        condition: service_healthy
      novu-redis:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - MONGO_URL=mongodb://novu-mongo:27017/novu
      - REDIS_HOST=novu-redis
      - REDIS_PORT=6379
      - REDIS_DB_INDEX=2
      - JWT_SECRET=${NOVU_JWT_SECRET:-your-jwt-secret-change-in-production}
      - PORT=3002
    ports:
      - "${NOVU_WS_PORT:-3002}:3002"
    networks:
      - crm-network

  # MongoDB for Novu (data storage)
  novu-mongo:
    image: mongo:6
    container_name: crm-novu-mongo
    volumes:
      - novu-mongo-data:/data/db
    environment:
      - PUID=1000
      - PGID=1000
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - crm-network

  # Redis for Novu (job queue and caching)
  novu-redis:
    image: redis:7-alpine
    container_name: crm-novu-redis
    volumes:
      - novu-redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crm-network

  # ═══════════════════════════════════════════════════════════════════════════
  # CHATWOOT - Self-Hosted Live Chat & Customer Engagement
  # https://chatwoot.com - Open-source customer engagement platform
  # Phase 3 Week 12: Chat Provider Implementation
  # ═══════════════════════════════════════════════════════════════════════════

  chatwoot-web:
    image: chatwoot/chatwoot:v3.13.0
    container_name: crm-chatwoot-web
    depends_on:
      chatwoot-postgres:
        condition: service_healthy
      chatwoot-redis:
        condition: service_healthy
    command: bundle exec rails s -p 3000 -b 0.0.0.0
    entrypoint: docker/entrypoints/rails.sh
    environment:
      - RAILS_ENV=production
      - NODE_ENV=production
      - SECRET_KEY_BASE=${CHATWOOT_SECRET_KEY:-replace-with-secure-secret-key-64-chars-minimum}
      - POSTGRES_HOST=chatwoot-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=chatwoot_production
      - POSTGRES_USERNAME=chatwoot
      - POSTGRES_PASSWORD=${CHATWOOT_DB_PASSWORD:-chatwoot_password}
      - REDIS_URL=redis://chatwoot-redis:6379
      - REDIS_PASSWORD=${CHATWOOT_REDIS_PASSWORD:-}
      - FRONTEND_URL=http://localhost:3003
      - DEFAULT_LOCALE=en
      - FORCE_SSL=false
      # SMTP settings (optional - for email notifications)
      - SMTP_ADDRESS=${CHATWOOT_SMTP_ADDRESS:-}
      - SMTP_PORT=${CHATWOOT_SMTP_PORT:-587}
      - SMTP_USERNAME=${CHATWOOT_SMTP_USERNAME:-}
      - SMTP_PASSWORD=${CHATWOOT_SMTP_PASSWORD:-}
      - SMTP_DOMAIN=${CHATWOOT_SMTP_DOMAIN:-}
      # ActiveStorage (local by default)
      - ACTIVE_STORAGE_SERVICE=local
      # CRM Integration settings
      - ENABLE_ACCOUNT_SIGNUP=false
    volumes:
      - chatwoot-data:/app/storage
    ports:
      - "${CHATWOOT_PORT:-3003}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/v1/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - crm-network

  # Chatwoot Sidekiq Worker (Background job processing)
  chatwoot-worker:
    image: chatwoot/chatwoot:v3.13.0
    container_name: crm-chatwoot-worker
    depends_on:
      chatwoot-postgres:
        condition: service_healthy
      chatwoot-redis:
        condition: service_healthy
    command: bundle exec sidekiq -C config/sidekiq.yml
    environment:
      - RAILS_ENV=production
      - SECRET_KEY_BASE=${CHATWOOT_SECRET_KEY:-replace-with-secure-secret-key-64-chars-minimum}
      - POSTGRES_HOST=chatwoot-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=chatwoot_production
      - POSTGRES_USERNAME=chatwoot
      - POSTGRES_PASSWORD=${CHATWOOT_DB_PASSWORD:-chatwoot_password}
      - REDIS_URL=redis://chatwoot-redis:6379
      - REDIS_PASSWORD=${CHATWOOT_REDIS_PASSWORD:-}
      - ACTIVE_STORAGE_SERVICE=local
    volumes:
      - chatwoot-data:/app/storage
    networks:
      - crm-network

  # PostgreSQL for Chatwoot
  chatwoot-postgres:
    image: postgres:15-alpine
    container_name: crm-chatwoot-postgres
    volumes:
      - chatwoot-postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=chatwoot_production
      - POSTGRES_USER=chatwoot
      - POSTGRES_PASSWORD=${CHATWOOT_DB_PASSWORD:-chatwoot_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatwoot -d chatwoot_production"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - crm-network

  # Redis for Chatwoot (Sidekiq jobs and caching)
  chatwoot-redis:
    image: redis:7-alpine
    container_name: crm-chatwoot-redis
    volumes:
      - chatwoot-redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crm-network

  # ═══════════════════════════════════════════════════════════════════════════
  # DOCUSEAL - Self-Hosted E-Signature Platform
  # https://www.docuseal.co - Open source DocuSign alternative
  # ═══════════════════════════════════════════════════════════════════════════
  
  docuseal:
    image: docuseal/docuseal:1.5.7
    container_name: crm-docuseal
    depends_on:
      docuseal-postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://docuseal:${DOCUSEAL_DB_PASSWORD:-docuseal_password}@docuseal-postgres:5432/docuseal
      - SECRET_KEY_BASE=${DOCUSEAL_SECRET_KEY:-replace-with-secure-secret-key-64-chars-minimum}
      - HOST=${DOCUSEAL_HOST:-localhost:3001}
      # Webhook configuration
      - WEBHOOK_URL=${DOCUSEAL_WEBHOOK_URL:-}
      - WEBHOOK_SECRET=${DOCUSEAL_WEBHOOK_SECRET:-}
      # SMTP settings (optional - for email notifications)
      - SMTP_ADDRESS=${DOCUSEAL_SMTP_ADDRESS:-}
      - SMTP_PORT=${DOCUSEAL_SMTP_PORT:-587}
      - SMTP_USERNAME=${DOCUSEAL_SMTP_USERNAME:-}
      - SMTP_PASSWORD=${DOCUSEAL_SMTP_PASSWORD:-}
      - SMTP_DOMAIN=${DOCUSEAL_SMTP_DOMAIN:-}
      - SMTP_FROM=${DOCUSEAL_SMTP_FROM:-}
      # Storage settings (local by default)
      - ACTIVE_STORAGE_SERVICE=local
    volumes:
      - docuseal-data:/data
    ports:
      - "${DOCUSEAL_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - crm-network

  # PostgreSQL for DocuSeal
  docuseal-postgres:
    image: postgres:15-alpine
    container_name: crm-docuseal-postgres
    volumes:
      - docuseal-postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=docuseal
      - POSTGRES_USER=docuseal
      - POSTGRES_PASSWORD=${DOCUSEAL_DB_PASSWORD:-docuseal_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docuseal -d docuseal"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - crm-network

  # ═══════════════════════════════════════════════════════════════════════════
  # APACHE SUPERSET - Self-Hosted Business Intelligence & Data Visualization
  # https://superset.apache.org - Modern data exploration and visualization
  # Phase 5 Week 21: Analytics Provider Implementation
  # ═══════════════════════════════════════════════════════════════════════════
  
  superset:
    image: apache/superset:3.1.0
    container_name: crm-superset
    depends_on:
      superset-postgres:
        condition: service_healthy
      superset-redis:
        condition: service_healthy
    environment:
      - SUPERSET_SECRET_KEY=${SUPERSET_SECRET_KEY:-replace-with-secure-secret-key-64-chars-minimum}
      - SUPERSET_LOAD_EXAMPLES=false
      # Database configuration
      - DATABASE_HOST=superset-postgres
      - DATABASE_PORT=5432
      - DATABASE_DB=superset
      - DATABASE_USER=superset
      - DATABASE_PASSWORD=${SUPERSET_DB_PASSWORD:-superset_password}
      # Redis configuration
      - REDIS_HOST=superset-redis
      - REDIS_PORT=6379
      # Guest token settings for embedding
      - GUEST_TOKEN_JWT_SECRET=${SUPERSET_GUEST_TOKEN_SECRET:-guest-token-secret-change-me}
      - GUEST_TOKEN_JWT_EXP_SECONDS=3600
      # Additional settings
      - TALISMAN_ENABLED=false
      - WTF_CSRF_ENABLED=false
      - ENABLE_PROXY_FIX=true
      - 'FEATURE_FLAGS={"EMBEDDED_SUPERSET": true, "DASHBOARD_RBAC": true}'
    volumes:
      - superset-data:/app/superset_home
    ports:
      - "${SUPERSET_PORT:-8088}:8088"
    command: >
      bash -c "superset db upgrade &&
               superset fab create-admin --username admin --firstname Admin --lastname User --email admin@crm.local --password ${SUPERSET_ADMIN_PASSWORD:-admin123} || true &&
               superset init &&
               gunicorn --bind 0.0.0.0:8088 --workers 4 --timeout 120 --limit-request-line 0 --limit-request-field_size 0 'superset.app:create_app()'"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - crm-network

  # Superset Celery Worker (Background jobs)
  superset-worker:
    image: apache/superset:3.1.0
    container_name: crm-superset-worker
    depends_on:
      superset:
        condition: service_healthy
      superset-postgres:
        condition: service_healthy
      superset-redis:
        condition: service_healthy
    environment:
      - SUPERSET_SECRET_KEY=${SUPERSET_SECRET_KEY:-replace-with-secure-secret-key-64-chars-minimum}
      - DATABASE_HOST=superset-postgres
      - DATABASE_PORT=5432
      - DATABASE_DB=superset
      - DATABASE_USER=superset
      - DATABASE_PASSWORD=${SUPERSET_DB_PASSWORD:-superset_password}
      - REDIS_HOST=superset-redis
      - REDIS_PORT=6379
    command: celery --app=superset.tasks.celery_app:app worker --pool=prefork -O fair -c 4
    healthcheck:
      test: ["CMD", "celery", "--app=superset.tasks.celery_app:app", "inspect", "ping", "-d", "celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - crm-network

  # Superset Celery Beat (Scheduled tasks)
  superset-beat:
    image: apache/superset:3.1.0
    container_name: crm-superset-beat
    depends_on:
      superset:
        condition: service_healthy
      superset-postgres:
        condition: service_healthy
      superset-redis:
        condition: service_healthy
    environment:
      - SUPERSET_SECRET_KEY=${SUPERSET_SECRET_KEY:-replace-with-secure-secret-key-64-chars-minimum}
      - DATABASE_HOST=superset-postgres
      - DATABASE_PORT=5432
      - DATABASE_DB=superset
      - DATABASE_USER=superset
      - DATABASE_PASSWORD=${SUPERSET_DB_PASSWORD:-superset_password}
      - REDIS_HOST=superset-redis
      - REDIS_PORT=6379
    command: celery --app=superset.tasks.celery_app:app beat --pidfile /tmp/celerybeat.pid --schedule /tmp/celerybeat-schedule
    networks:
      - crm-network

  # PostgreSQL for Superset (metadata storage)
  superset-postgres:
    image: postgres:15-alpine
    container_name: crm-superset-postgres
    volumes:
      - superset-postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=superset
      - POSTGRES_USER=superset
      - POSTGRES_PASSWORD=${SUPERSET_DB_PASSWORD:-superset_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset -d superset"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - crm-network

  # Redis for Superset (Celery broker and cache)
  superset-redis:
    image: redis:7-alpine
    container_name: crm-superset-redis
    volumes:
      - superset-redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crm-network

networks:
  crm-network:
    external: true
    name: docker_crm-network

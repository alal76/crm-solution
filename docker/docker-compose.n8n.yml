# CRM Solution - n8n Workflow Automation
# Self-hosted workflow integration and automation platform
# https://n8n.io
#
# Usage (standalone):
#   docker compose -f docker-compose.n8n.yml up -d
#
# Usage (overlay with core stack):
#   docker compose -f docker-compose.yml -f docker-compose.n8n.yml up -d
#
# Access: http://<host>:5678
# Default credentials: admin / Admin@123 (change via N8N_BASIC_AUTH_PASSWORD)

volumes:
  n8n-data:

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: crm-n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      # Authentication
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_ADMIN_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_ADMIN_PASSWORD:-Admin@123}
      # Server configuration
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://${API_EXTERNAL_HOSTNAME:-localhost}:5678/
      # Database (SQLite - simple, no external DB needed)
      - DB_TYPE=sqlite
      - N8N_USER_FOLDER=/home/node/.n8n
      # Timezone
      - GENERIC_TIMEZONE=${TIMEZONE:-UTC}
      # Security
      - N8N_SECURE_COOKIE=false
      # Disable diagnostics in self-hosted
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
    volumes:
      - n8n-data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5678/healthz 2>/dev/null || curl -sf http://127.0.0.1:5678/healthz 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - crm-network

networks:
  crm-network:
    external: true
    name: docker_crm-network

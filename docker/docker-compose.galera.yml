# CRM Solution — Galera Cluster (3-Node MariaDB HA)
# TODO-DB-009: Node 1 definition (crm-mariadb-node1 @ 192.168.0.9)
# TODO-DB-010: Node 2 definition (crm-mariadb-node2 @ 192.168.0.10)
# TODO-DB-011: Node 3 definition (crm-mariadb-node3 @ 192.168.0.11)
#
# Architecture:
#   3-node synchronous Galera cluster using bitnami/mariadb-galera.
#   All nodes accept reads; writes are routed via ProxySQL (see docker-compose.proxysql.yml).
#
# First-time bootstrap (run ONCE on node1):
#   GALERA_CLUSTER_BOOTSTRAP=yes docker-compose -f docker-compose.galera.yml up crm-mariadb-node1
#   # Wait for node1 healthy, then:
#   docker-compose -f docker-compose.galera.yml up crm-mariadb-node2 crm-mariadb-node3
#
# Subsequent starts (normal):
#   docker-compose -f docker-compose.galera.yml up -d
#
# Config file: docker/galera.cnf

version: '3.8'

volumes:
  galera-node1-data:
    driver: local
  galera-node2-data:
    driver: local
  galera-node3-data:
    driver: local

networks:
  crm-galera-network:
    driver: bridge
    name: crm-galera-network
    ipam:
      config:
        - subnet: 172.28.0.0/24
  # Expose to the main CRM network so ProxySQL can connect
  crm-database-network:
    external: true

# ---------------------------------------------------------------------------
# Common Galera node configuration (YAML anchor)
# ---------------------------------------------------------------------------
x-galera-common: &galera-common
  image: bitnami/mariadb-galera:latest
  restart: unless-stopped
  environment:
    MARIADB_ROOT_PASSWORD: &root-pw ${MARIADB_ROOT_PASSWORD:-RootPass@Dev2024}
    MARIADB_DATABASE: ${MARIADB_DATABASE:-crm_db}
    MARIADB_USER: ${MARIADB_USER:-crm_user}
    MARIADB_PASSWORD: ${MARIADB_PASSWORD:-CrmPass@Dev2024}
    # Galera / WSREP
    MARIADB_GALERA_CLUSTER_NAME: ${GALERA_CLUSTER_NAME:-crm_galera_cluster}
    MARIADB_GALERA_CLUSTER_ADDRESS: "gcomm://crm-mariadb-node1,crm-mariadb-node2,crm-mariadb-node3"
    MARIADB_GALERA_MARIABACKUP_USER: ${GALERA_SST_USER:-sst_user}
    MARIADB_GALERA_MARIABACKUP_PASSWORD: ${GALERA_SST_PASSWORD:-SstPass@Dev2024}
    MARIADB_REPLICATION_USER: ${REPLICATION_USER:-repl_user}
    MARIADB_REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-ReplPass@Dev2024}
    # InnoDB tuning
    MARIADB_EXTRA_FLAGS: >-
      --innodb-buffer-pool-size=512M
      --innodb-log-file-size=128M
      --innodb-flush-log-at-trx-commit=0
      --wsrep-sync-wait=1
  healthcheck:
    test: ["CMD", "mariadb-admin", "ping", "-u", "root", "-p${MARIADB_ROOT_PASSWORD:-RootPass@Dev2024}", "-h", "localhost"]
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 60s

services:
  # ============================================================
  # TODO-DB-009 — Node 1 (Primary / Bootstrap node)
  # Host IP: 192.168.0.9
  # ============================================================
  crm-mariadb-node1:
    <<: *galera-common
    container_name: crm-mariadb-node1
    environment:
      MARIADB_ROOT_PASSWORD: *root-pw
      MARIADB_DATABASE: ${MARIADB_DATABASE:-crm_db}
      MARIADB_USER: ${MARIADB_USER:-crm_user}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-CrmPass@Dev2024}
      MARIADB_GALERA_CLUSTER_NAME: ${GALERA_CLUSTER_NAME:-crm_galera_cluster}
      MARIADB_GALERA_CLUSTER_ADDRESS: "gcomm://crm-mariadb-node1,crm-mariadb-node2,crm-mariadb-node3"
      MARIADB_GALERA_MARIABACKUP_USER: ${GALERA_SST_USER:-sst_user}
      MARIADB_GALERA_MARIABACKUP_PASSWORD: ${GALERA_SST_PASSWORD:-SstPass@Dev2024}
      MARIADB_REPLICATION_USER: ${REPLICATION_USER:-repl_user}
      MARIADB_REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-ReplPass@Dev2024}
      # Bootstrap: set to 'yes' ONLY for first-launch; remove or set 'no' after
      MARIADB_GALERA_CLUSTER_BOOTSTRAP: ${GALERA_CLUSTER_BOOTSTRAP:-no}
      MARIADB_GALERA_NODE_ADDRESS: "192.168.0.9"
      MARIADB_GALERA_NODE_NAME: "node1"
      MARIADB_EXTRA_FLAGS: >-
        --innodb-buffer-pool-size=512M
        --innodb-log-file-size=128M
        --innodb-flush-log-at-trx-commit=0
        --wsrep-sync-wait=1
    ports:
      - "3306:3306"    # MySQL protocol
      - "4567:4567"    # Galera replication
      - "4568:4568"    # IST (Incremental State Transfer)
      - "4444:4444"    # SST (State Snapshot Transfer)
    volumes:
      - galera-node1-data:/bitnami/mariadb
      - ./galera.cnf:/opt/bitnami/mariadb/conf/my_custom.cnf:ro
    networks:
      - crm-galera-network
      - crm-database-network
    labels:
      - "com.crm.galera.node=1"
      - "com.crm.galera.role=primary"

  # ============================================================
  # TODO-DB-010 — Node 2
  # Host IP: 192.168.0.10
  # ============================================================
  crm-mariadb-node2:
    <<: *galera-common
    container_name: crm-mariadb-node2
    depends_on:
      crm-mariadb-node1:
        condition: service_healthy
    environment:
      MARIADB_ROOT_PASSWORD: *root-pw
      MARIADB_DATABASE: ${MARIADB_DATABASE:-crm_db}
      MARIADB_USER: ${MARIADB_USER:-crm_user}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-CrmPass@Dev2024}
      MARIADB_GALERA_CLUSTER_NAME: ${GALERA_CLUSTER_NAME:-crm_galera_cluster}
      MARIADB_GALERA_CLUSTER_ADDRESS: "gcomm://crm-mariadb-node1,crm-mariadb-node2,crm-mariadb-node3"
      MARIADB_GALERA_MARIABACKUP_USER: ${GALERA_SST_USER:-sst_user}
      MARIADB_GALERA_MARIABACKUP_PASSWORD: ${GALERA_SST_PASSWORD:-SstPass@Dev2024}
      MARIADB_REPLICATION_USER: ${REPLICATION_USER:-repl_user}
      MARIADB_REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-ReplPass@Dev2024}
      MARIADB_GALERA_NODE_ADDRESS: "192.168.0.10"
      MARIADB_GALERA_NODE_NAME: "node2"
      MARIADB_EXTRA_FLAGS: >-
        --innodb-buffer-pool-size=512M
        --innodb-log-file-size=128M
        --innodb-flush-log-at-trx-commit=0
        --wsrep-sync-wait=1
    ports:
      - "3307:3306"
      - "4568:4568"
      - "4569:4569"
    volumes:
      - galera-node2-data:/bitnami/mariadb
      - ./galera.cnf:/opt/bitnami/mariadb/conf/my_custom.cnf:ro
    networks:
      - crm-galera-network
      - crm-database-network
    labels:
      - "com.crm.galera.node=2"
      - "com.crm.galera.role=replica"

  # ============================================================
  # TODO-DB-011 — Node 3
  # Host IP: 192.168.0.11
  # ============================================================
  crm-mariadb-node3:
    <<: *galera-common
    container_name: crm-mariadb-node3
    depends_on:
      crm-mariadb-node1:
        condition: service_healthy
    environment:
      MARIADB_ROOT_PASSWORD: *root-pw
      MARIADB_DATABASE: ${MARIADB_DATABASE:-crm_db}
      MARIADB_USER: ${MARIADB_USER:-crm_user}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-CrmPass@Dev2024}
      MARIADB_GALERA_CLUSTER_NAME: ${GALERA_CLUSTER_NAME:-crm_galera_cluster}
      MARIADB_GALERA_CLUSTER_ADDRESS: "gcomm://crm-mariadb-node1,crm-mariadb-node2,crm-mariadb-node3"
      MARIADB_GALERA_MARIABACKUP_USER: ${GALERA_SST_USER:-sst_user}
      MARIADB_GALERA_MARIABACKUP_PASSWORD: ${GALERA_SST_PASSWORD:-SstPass@Dev2024}
      MARIADB_REPLICATION_USER: ${REPLICATION_USER:-repl_user}
      MARIADB_REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-ReplPass@Dev2024}
      MARIADB_GALERA_NODE_ADDRESS: "192.168.0.11"
      MARIADB_GALERA_NODE_NAME: "node3"
      MARIADB_EXTRA_FLAGS: >-
        --innodb-buffer-pool-size=512M
        --innodb-log-file-size=128M
        --innodb-flush-log-at-trx-commit=0
        --wsrep-sync-wait=1
    ports:
      - "3308:3306"
      - "4570:4568"
      - "4571:4569"
    volumes:
      - galera-node3-data:/bitnami/mariadb
      - ./galera.cnf:/opt/bitnami/mariadb/conf/my_custom.cnf:ro
    networks:
      - crm-galera-network
      - crm-database-network
    labels:
      - "com.crm.galera.node=3"
      - "com.crm.galera.role=replica"

volumes:
  db-data:
  api-data:
  redis-data:
  meilisearch-data:
services:
  # Database Tier (MariaDB - Hosts both production and demo databases)
  mariadb:
    image: mariadb:11.2
    container_name: crm-mariadb
    restart: unless-stopped
    ports:
      - "${DB_EXTERNAL_PORT:-3306}:3306"
    environment:
      - Logging__LogLevel__Default=Debug
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-RootPass@Dev2024}
      - MARIADB_DATABASE=${DB_NAME:-crm_db}
      - MARIADB_USER=${DB_USER:-crm_user}
      - MARIADB_PASSWORD=${DB_PASSWORD:-CrmPass@Dev2024}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-RootPass@Dev2024}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - crm-network

  # Redis Cache (Distributed Caching)
  redis:
    image: redis:7-alpine
    container_name: crm-redis
    restart: unless-stopped
    ports:
      - "${REDIS_EXTERNAL_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crm-network

  # Meilisearch (Full-Text Search Engine)
  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: crm-meilisearch
    restart: unless-stopped
    ports:
      - "${MEILISEARCH_EXTERNAL_PORT:-7700}:7700"
    volumes:
      - meilisearch-data:/meili_data
    environment:
      - MEILI_MASTER_KEY=${MEILISEARCH_API_KEY:-masterKey123}
      - MEILI_ENV=${MEILISEARCH_ENV:-development}
      - MEILI_NO_ANALYTICS=true
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:7700/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - crm-network

  # API Tier (Application/Business Logic)
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: crm-api:latest
    container_name: crm-api
    restart: unless-stopped
    ports:
      - "${API_EXTERNAL_PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - AllowedHosts=*
      - DatabaseProvider=${DATABASE_PROVIDER:-mariadb}
      - DB_HOST=${DB_HOST:-mariadb}
      - DB_PORT=${DB_INTERNAL_PORT:-3306}
      - DB_NAME=${DB_NAME:-crm_db}
      - DB_USER=${DB_USER:-crm_user}
      - DB_PASSWORD=${DB_PASSWORD:-CrmPass@Dev2024}
      # Default connection string for production database
      - ConnectionStrings__DefaultConnection=Server=${DB_HOST:-mariadb};Port=${DB_PORT:-3306};Database=${DB_NAME:-crm_db};User=${DB_USER:-crm_user};Password=${DB_PASSWORD:-CrmPass@Dev2024};
      # Demo database (crm_demodb) is auto-created on same server
      - DemoDatabase__AutoSeed=${DEMO_AUTO_SEED:-true}
      - DemoDatabase__DatabaseName=${DEMO_DB_NAME:-crm_demodb}
      - API_EXTERNAL_PORT=${API_EXTERNAL_PORT:-5000}
      - API_INTERNAL_PORT=${API_INTERNAL_PORT:-5000}
      - Jwt__ExpirationMinutes=${JWT_EXPIRATION_MINUTES:-15}
      - Jwt__Secret=${JWT_SECRET:-CrmJwtSecretKey2024ForSecureAuthentication}
      # Workflow Worker - disable during development to avoid timeout issues (set to false for production)
      - SKIP_WORKFLOW_WORKER=${SKIP_WORKFLOW_WORKER:-true}
      # Contract storage configuration
      - CONTRACT_STORAGE_PATH=${CONTRACT_STORAGE_PATH:-/app/data/contracts}
      - MAX_CONTRACT_FILE_SIZE_BYTES=${MAX_CONTRACT_FILE_SIZE:-10485760}
      - ALLOWED_CONTRACT_MIME_TYPES=${ALLOWED_MIME_TYPES:-application/pdf,image/png,image/jpeg,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document}
      # Redis cache configuration
      - Redis__ConnectionString=${REDIS_HOST:-redis}:${REDIS_PORT:-6379}
      - Redis__InstanceName=${REDIS_INSTANCE:-crm_}
      - Redis__Enabled=${REDIS_ENABLED:-true}
      # Monitoring configuration
      - Monitoring__DeploymentType=${DEPLOYMENT_TYPE:-docker}
      - Monitoring__BuildServer=${BUILD_SERVER:-localhost}
      - Monitoring__BuildServerFQDN=${BUILD_SERVER_FQDN:-}
      - Monitoring__EnableDockerMonitoring=${ENABLE_DOCKER_MONITORING:-true}
      - Monitoring__EnableK8sMonitoring=${ENABLE_K8S_MONITORING:-false}
      - Monitoring__DatabaseProvider=${DATABASE_PROVIDER:-mariadb}
      - Frontend__Url=${FRONTEND_URL:-http://localhost}
      # Feature Management - Provider Selection (false = BuiltIn, true = External)
      - FeatureManagement__UseExternalChat=${USE_EXTERNAL_CHAT:-false}
      - FeatureManagement__UseExternalSearch=${USE_EXTERNAL_SEARCH:-false}
      - FeatureManagement__UseExternalNotifications=${USE_EXTERNAL_NOTIFICATIONS:-false}
      - FeatureManagement__UseExternalAnalytics=${USE_EXTERNAL_ANALYTICS:-false}
      - FeatureManagement__UseExternalSignatures=${USE_EXTERNAL_SIGNATURES:-false}
      - FeatureManagement__UseExternalAI=${USE_EXTERNAL_AI:-false}
      - FeatureManagement__UseExternalIntegrations=${USE_EXTERNAL_INTEGRATIONS:-false}
      # Feature Management - Module Toggles
      - FeatureManagement__EnableITSM=${ENABLE_ITSM:-true}
      - FeatureManagement__EnableMarketing=${ENABLE_MARKETING:-true}
      - FeatureManagement__EnableCustomerPortal=${ENABLE_CUSTOMER_PORTAL:-false}
      - FeatureManagement__EnablePartnerPortal=${ENABLE_PARTNER_PORTAL:-false}
      - FeatureManagement__EnableKnowledgeBase=${ENABLE_KNOWLEDGE_BASE:-true}
      # Feature Management - Feature Rollout
      - FeatureManagement__NewSearchExperience=${NEW_SEARCH_EXPERIENCE:-false}
      - FeatureManagement__AIAssistant=${AI_ASSISTANT:-true}
      - FeatureManagement__RealTimeNotifications=${REALTIME_NOTIFICATIONS:-true}
      - FeatureManagement__AdvancedWorkflows=${ADVANCED_WORKFLOWS:-true}
      # Provider Configuration - Types
      - Providers__Chat__Type=${PROVIDER_CHAT_TYPE:-BuiltIn}
      - Providers__Search__Type=${PROVIDER_SEARCH_TYPE:-BuiltIn}
      - Providers__Notifications__Type=${PROVIDER_NOTIFICATIONS_TYPE:-BuiltIn}
      - Providers__Analytics__Type=${PROVIDER_ANALYTICS_TYPE:-BuiltIn}
      - Providers__Signatures__Type=${PROVIDER_SIGNATURES_TYPE:-BuiltIn}
      - Providers__Integrations__Type=${PROVIDER_INTEGRATIONS_TYPE:-BuiltIn}
      # External Provider Endpoints (optional - when External=true)
      - Providers__Chat__Chatwoot__BaseUrl=${CHATWOOT_BASE_URL:-}
      - Providers__Chat__Chatwoot__ApiKey=${CHATWOOT_API_KEY:-}
      - Providers__Search__Meilisearch__Url=${MEILISEARCH_URL:-http://meilisearch:7700}
      - Providers__Search__Meilisearch__ApiKey=${MEILISEARCH_API_KEY:-}
      - Providers__Notifications__Novu__ApiKey=${NOVU_API_KEY:-}
      - Providers__Analytics__Superset__Url=${SUPERSET_URL:-http://superset:8088}
      - Providers__Signatures__DocuSeal__Url=${DOCUSEAL_URL:-http://docuseal:3001}
      - Providers__Integrations__N8n__Url=${N8N_URL:-http://n8n:5678}
    volumes:
      - api-data:/app/data
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - crm-network

  # Frontend Tier (Presentation)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        BUILD_DATE: "2026-01-20T12:00:00Z"
        REACT_APP_API_URL: ${REACT_APP_API_URL}
        REACT_APP_API_PORT: ${API_INTERNAL_PORT:-5000}
        REACT_APP_API_EXTERNAL_PORT: ${API_EXTERNAL_PORT:-5000}
        REACT_APP_DB_PORT: ${DB_INTERNAL_PORT:-3306}
        REACT_APP_FRONTEND_PORT: ${FRONTEND_EXTERNAL_PORT:-80}
    # image: crm-frontend:latest  # Uncomment when using pre-built image
    image: crm-frontend:latest
    container_name: crm-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_EXTERNAL_PORT:-80}:80"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - crm-network

networks:
  crm-network:
    driver: bridge

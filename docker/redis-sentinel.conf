# =============================================================================
# CRM Solution — Redis Sentinel Configuration
# TODO-DB-014: Sentinel config for crm-redis HA monitoring
#
# Mount path inside container: /etc/redis/sentinel.conf
# Sentinel port: 26379
# =============================================================================

# ── Sentinel port ──────────────────────────────────────────────────────────
port 26379

# ── Monitoring target ─────────────────────────────────────────────────────
# <master-name> <host> <port> <quorum>
# quorum = 2 means at least 2 sentinels must agree before declaring master down
sentinel monitor crm-redis crm-redis-master 6379 2

# ── Authentication ────────────────────────────────────────────────────────
# Must match Redis requirepass setting
sentinel auth-pass crm-redis RedisPass@Dev2024

# ── Failure detection ─────────────────────────────────────────────────────
# Number of milliseconds master is unreachable before flagging as SDOWN
sentinel down-after-milliseconds crm-redis 5000

# ── Failover timeout ──────────────────────────────────────────────────────
# Max ms allowed for a failover attempt; also controls retry intervals
sentinel failover-timeout crm-redis 60000

# ── Parallel syncs ────────────────────────────────────────────────────────
# Number of replicas reconfigured in parallel after failover
sentinel parallel-syncs crm-redis 1

# ── Sentinel announce (for Docker networking) ─────────────────────────────
# Sentinels announce their own address so replicas can find them after failover.
# This IP/hostname is resolved within the crm-redis-sentinel-network.
# In production, set these to the host IPs.
# sentinel announce-ip <container-name>   # set dynamically via entrypoint
# sentinel announce-port 26379

# ── Logging ──────────────────────────────────────────────────────────────
loglevel notice
logfile ""

# ── Sentinel ACL (optional hardening) ────────────────────────────────────
# requirepass SentinelPass@Dev2024

# ── Connection limits ────────────────────────────────────────────────────
protected-mode no

# =============================================================================
# StorageClass for database persistent storage
# Uses dynamic provisioning — compatible with multi-node clusters.
#
# For cloud providers, replace the provisioner:
#   AWS EBS:        kubernetes.io/aws-ebs       (or ebs.csi.aws.com)
#   Azure Disk:     kubernetes.io/azure-disk     (or disk.csi.azure.com)
#   GCP PD:         kubernetes.io/gce-pd         (or pd.csi.storage.gke.io)
#   NFS:            nfs-subdir-external-provisioner
#   Ceph/Rook:      rook-ceph.rbd.csi.ceph.com
#
# For single-node development, the default provisioner (or rancher.io/local-path)
# works out of the box.
# =============================================================================
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: crm-database-storage
provisioner: rancher.io/local-path   # Replace with cloud CSI driver for production
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crm-db-pvc
  namespace: crm-dev
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: crm-database-storage
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: crm-db
  namespace: crm-dev
spec:
  serviceName: crm-db
  replicas: 1
  selector:
    matchLabels:
      tier: database
  template:
    metadata:
      labels:
        tier: database
        app: crm
    spec:
      containers:
      - name: mariadb
        image: mariadb:11.2
        ports:
        - containerPort: 3306
          name: db
        volumeMounts:
        - name: db-storage
          mountPath: /var/lib/mysql
        env:
        - name: MARIADB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: crm-secrets
              key: DB_ROOT_PASSWORD
        - name: MARIADB_DATABASE
          value: "crm_db"
        - name: MARIADB_USER
          value: "crm_user"
        - name: MARIADB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: crm-secrets
              key: DB_PASSWORD
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - /bin/bash
            - -c
            - "mariadb-admin ping -h localhost -u root -p$MARIADB_ROOT_PASSWORD"
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          exec:
            command:
            - /bin/bash
            - -c
            - "mariadb -u root -p$MARIADB_ROOT_PASSWORD -e 'SELECT 1'"
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
      volumes:
      - name: db-storage
        persistentVolumeClaim:
          claimName: crm-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: crm-db
  namespace: crm-dev
spec:
  clusterIP: None
  selector:
    tier: database
  ports:
  - port: 3306
    targetPort: 3306
    name: db

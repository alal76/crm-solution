apiVersion: v1
kind: PersistentVolume
metadata:
  name: crm-db-pv
  namespace: crm-app
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: standard
  # WARNING: hostPath is for single-node/development only.
  # For production, use a PersistentVolumeClaim with a proper StorageClass
  # (e.g., cloud block storage, NFS, or Ceph) for multi-node reliability.
  hostPath:
    path: /data/crm
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crm-db-pvc
  namespace: crm-app
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: crm-db
  namespace: crm-app
spec:
  serviceName: crm-db
  replicas: 1
  selector:
    matchLabels:
      tier: database
  template:
    metadata:
      labels:
        tier: database
        app: crm
    spec:
      containers:
      - name: mariadb
        image: mariadb:11.2
        ports:
        - containerPort: 3306
          name: db
        volumeMounts:
        - name: db-storage
          mountPath: /var/lib/mysql
        env:
        - name: MARIADB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: crm-secrets
              key: DB_ROOT_PASSWORD
        - name: MARIADB_DATABASE
          value: "crm_db"
        - name: MARIADB_USER
          value: "crm_user"
        - name: MARIADB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: crm-secrets
              key: DB_PASSWORD
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - /bin/bash
            - -c
            - "mariadb-admin ping -h localhost -u root -p$MARIADB_ROOT_PASSWORD"
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          exec:
            command:
            - /bin/bash
            - -c
            - "mariadb -u root -p$MARIADB_ROOT_PASSWORD -e 'SELECT 1'"
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
      volumes:
      - name: db-storage
        persistentVolumeClaim:
          claimName: crm-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: crm-db
  namespace: crm-app
spec:
  clusterIP: None
  selector:
    tier: database
  ports:
  - port: 3306
    targetPort: 3306
    name: db

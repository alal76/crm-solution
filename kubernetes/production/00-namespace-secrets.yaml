# Production Kubernetes Configuration
# Target: Set DB_HOST and other configs via environment or kubectl
# IMPORTANT: Replace placeholder values before deploying to production!
---
apiVersion: v1
kind: Namespace
metadata:
  name: crm-prod
  labels:
    environment: production
    app: crm
    name: crm-prod
---
# Application configuration for generic production deployment.
# Named crm-api-config (not crm-config) so it does not collide with the
# crm-config ConfigMap defined in 00-namespace-config-192.168.0.9.yaml
# for the 192.168.0.9 server deployment (S6907 prevention).
apiVersion: v1
kind: ConfigMap
metadata:
  name: crm-api-config
  namespace: crm-prod
data:
  # Database host - CONFIGURE FOR YOUR ENVIRONMENT
  DB_HOST: "crm-db.production.local"  # Replace with your database hostname
  DB_PORT: "3306"
  DB_NAME: "crm_db"
  # DEPRECATED: Demo database feature removed - system uses single database only
  # DemoDatabase__AutoSeed: "false"  # Disable in production
  # DemoDatabase__DatabaseName: "crm_demodb"
  # API Configuration
  API_HOST: "0.0.0.0"
  API_PORT: "5000"
  HTTPS_PORT: "5001"
---
apiVersion: v1
kind: Secret
metadata:
  name: crm-secrets
  namespace: crm-prod
type: Opaque
stringData:
  # Database credentials - UPDATE THESE FOR PRODUCTION
  MARIADB_ROOT_PASSWORD: "CHANGE_ME_ROOT_PASSWORD"
  MARIADB_USER: "crm_user"
  MARIADB_PASSWORD: "CHANGE_ME_DB_PASSWORD"
  # Connection string - CONFIGURE FOR YOUR ENVIRONMENT
  DB_CONNECTION_STRING: "Server=crm-db.production.local;Port=3306;Database=crm_db;User=crm_user;Password=CHANGE_ME_DB_PASSWORD;CharSet=utf8mb4;AllowUserVariables=true"
  # JWT Configuration - MUST CHANGE FOR PRODUCTION
  JWT_SECRET: "CHANGE_ME_GENERATE_SECURE_SECRET_AT_LEAST_32_CHARACTERS_LONG"
  JWT_ISSUER: "CRM.Api"
  JWT_AUDIENCE: "CRM.Frontend"
---
apiVersion: v1
kind: Secret
metadata:
  name: crm-ssl-secret
  namespace: crm-prod
type: Opaque
stringData:
  SSL_CERT_PASSWORD: ""

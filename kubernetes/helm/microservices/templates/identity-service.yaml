{{- if .Values.services.identity.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "crm-microservices.fullname" . }}-identity
  labels:
    {{- include "crm-microservices.labels" . | nindent 4 }}
    app.kubernetes.io/component: identity
spec:
  type: ClusterIP
  selector:
    {{- include "crm-microservices.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: identity
  ports:
  - port: {{ .Values.services.identity.port }}
    targetPort: {{ .Values.services.identity.port }}
    name: http
{{- end }}

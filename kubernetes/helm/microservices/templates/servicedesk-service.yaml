{{- if .Values.services.servicedesk.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "crm-microservices.fullname" . }}-servicedesk
  labels:
    {{- include "crm-microservices.labels" . | nindent 4 }}
    app.kubernetes.io/component: servicedesk
spec:
  type: ClusterIP
  selector:
    {{- include "crm-microservices.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: servicedesk
  ports:
  - port: {{ .Values.services.servicedesk.port }}
    targetPort: {{ .Values.services.servicedesk.port }}
    name: http
{{- end }}

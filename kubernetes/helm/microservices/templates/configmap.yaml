apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "crm-microservices.fullname" . }}-config
  labels:
    {{- include "crm-microservices.labels" . | nindent 4 }}
data:
  ASPNETCORE_ENVIRONMENT: {{ .Values.config.ASPNETCORE_ENVIRONMENT | quote }}
  JWT_ISSUER: {{ .Values.config.JWT_ISSUER | quote }}
  JWT_AUDIENCE: {{ .Values.config.JWT_AUDIENCE | quote }}
  DB_HOST: {{ default (printf "%s-db" (include "crm-microservices.fullname" .)) .Values.config.DB_HOST | quote }}
  DB_PORT: {{ .Values.config.DB_PORT | quote }}
  DB_NAME: {{ .Values.config.DB_NAME | quote }}
  REACT_APP_API_URL: {{ .Values.config.REACT_APP_API_URL | quote }}

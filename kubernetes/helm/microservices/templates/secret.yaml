apiVersion: v1
kind: Secret
metadata:
  name: {{ include "crm-microservices.fullname" . }}-secrets
  labels:
    {{- include "crm-microservices.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_KEY: {{ .Values.secrets.JWT_KEY | quote }}
  DB_USER: {{ .Values.secrets.DB_USER | quote }}
  DB_PASSWORD: {{ .Values.secrets.DB_PASSWORD | quote }}
  DB_ROOT_PASSWORD: {{ .Values.secrets.DB_ROOT_PASSWORD | quote }}

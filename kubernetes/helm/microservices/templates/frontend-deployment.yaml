{{- if .Values.services.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "crm-microservices.fullname" . }}-frontend
  labels:
    {{- include "crm-microservices.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.services.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "crm-microservices.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "crm-microservices.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: crm-frontend
        image: {{ .Values.images.frontend.repository }}:{{ .Values.images.frontend.tag }}
        imagePullPolicy: {{ .Values.images.frontend.pullPolicy }}
        ports:
        - containerPort: {{ .Values.services.frontend.port }}
          name: http
        envFrom:
        - configMapRef:
            name: {{ include "crm-microservices.fullname" . }}-config
        resources:
          {{- toYaml (default .Values.resources.default .Values.resources.frontend) | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.services.frontend.port }}
          initialDelaySeconds: 10
          periodSeconds: 15
{{- end }}

{{- if .Values.services.servicedesk.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "crm-microservices.fullname" . }}-servicedesk
  labels:
    {{- include "crm-microservices.labels" . | nindent 4 }}
    app.kubernetes.io/component: servicedesk
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "crm-microservices.fullname" . }}-servicedesk
  minReplicas: {{ .Values.services.servicedesk.hpa.minReplicas }}
  maxReplicas: {{ .Values.services.servicedesk.hpa.maxReplicas }}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ .Values.services.servicedesk.hpa.targetCPUUtilizationPercentage }}
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: {{ .Values.services.servicedesk.hpa.targetMemoryUtilizationPercentage }}
{{- end }}

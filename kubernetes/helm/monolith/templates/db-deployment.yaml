{{- if .Values.db.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "crm-monolith.fullname" . }}-db
  labels:
    {{- include "crm-monolith.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "crm-monolith.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        {{- include "crm-monolith.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: database
    spec:
      containers:
      - name: mariadb
        image: {{ .Values.images.db.repository }}:{{ .Values.images.db.tag }}
        imagePullPolicy: {{ .Values.images.db.pullPolicy }}
        ports:
        - containerPort: 3306
          name: db
        env:
        - name: MARIADB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "crm-monolith.fullname" . }}-secrets
              key: DB_ROOT_PASSWORD
        - name: MARIADB_DATABASE
          valueFrom:
            secretKeyRef:
              name: {{ include "crm-monolith.fullname" . }}-secrets
              key: DB_NAME
        - name: MARIADB_USER
          valueFrom:
            secretKeyRef:
              name: {{ include "crm-monolith.fullname" . }}-secrets
              key: DB_USER
        - name: MARIADB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "crm-monolith.fullname" . }}-secrets
              key: DB_PASSWORD
        volumeMounts:
        - name: db-storage
          mountPath: /var/lib/mysql
        resources:
          {{- toYaml .Values.db.resources | nindent 10 }}
      volumes:
      - name: db-storage
        persistentVolumeClaim:
          claimName: {{ include "crm-monolith.fullname" . }}-db-pvc
{{- end }}

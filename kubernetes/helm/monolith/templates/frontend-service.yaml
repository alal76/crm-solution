apiVersion: v1
kind: Service
metadata:
  name: {{ include "crm-monolith.fullname" . }}-frontend
  labels:
    {{- include "crm-monolith.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    {{- include "crm-monolith.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  ports:
  - port: {{ .Values.frontend.service.port }}
    targetPort: 80
    name: http

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "crm-monolith.fullname" . }}-config
  labels:
    {{- include "crm-monolith.labels" . | nindent 4 }}
data:
  ASPNETCORE_ENVIRONMENT: {{ .Values.config.ASPNETCORE_ENVIRONMENT | quote }}
  DatabaseProvider: {{ .Values.config.DatabaseProvider | quote }}
  NODE_ENV: {{ .Values.config.NODE_ENV | quote }}
  REACT_APP_API_URL: {{ .Values.config.REACT_APP_API_URL | quote }}

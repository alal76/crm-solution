apiVersion: v1
kind: Service
metadata:
  name: {{ include "crm-monolith.fullname" . }}-api
  labels:
    {{- include "crm-monolith.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  selector:
    {{- include "crm-monolith.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
  - port: {{ .Values.api.service.port }}
    targetPort: 5000
    name: http

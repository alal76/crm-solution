apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm-frontend
  namespace: crm-dev
  labels:
    tier: presentation
    app: crm
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      tier: presentation
      app: crm
  template:
    metadata:
      labels:
        tier: presentation
        app: crm
    spec:
      automountServiceAccountToken: false
      serviceAccountName: crm-frontend
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: crm-frontend
        image: ${REGISTRY_HOST:-registry.local}:5000/crm-frontend:v1  # Replace REGISTRY_HOST
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: crm-config
        env:
        - name: REACT_APP_API_URL
          value: "/api"  # Use relative URL with ingress routing
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
            ephemeral-storage: "128Mi"
          limits:
            memory: "512Mi"
            cpu: "500m"
            ephemeral-storage: "256Mi"
        # Startup probe: Allow container to start before liveness checks begin
        startupProbe:
          httpGet:
            path: /health
            port: 80
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 3
          timeoutSeconds: 3
          failureThreshold: 20  # Allow up to 60 seconds for startup
        # Liveness probe: Check if container is alive and healthy
        livenessProbe:
          httpGet:
            path: /health
            port: 80
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        # Readiness probe: Check if container is ready to serve traffic
        readinessProbe:
          httpGet:
            path: /health
            port: 80
            scheme: HTTP
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - crm
              topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: crm-frontend
  namespace: crm-dev
  labels:
    tier: presentation
spec:
  type: ClusterIP
  selector:
    tier: presentation
    app: crm
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: crm-frontend-hpa
  namespace: crm-dev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: crm-frontend
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 1
        periodSeconds: 30
      selectPolicy: Max
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crm-frontend
  namespace: crm-dev

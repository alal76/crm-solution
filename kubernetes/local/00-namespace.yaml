apiVersion: v1
kind: Namespace
metadata:
  name: crm-dev
  labels:
    app: crm
    name: crm-dev
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: crm-config
  namespace: crm-dev
data:
  ASPNETCORE_ENVIRONMENT: "Development"
  DatabaseProvider: "MariaDb"
  NODE_ENV: "production"
  REACT_APP_API_URL: "/api"
  # Demo database configuration - on same server as production
  DemoDatabase__AutoSeed: "true"
  DemoDatabase__DatabaseName: "crm_demodb"
---
apiVersion: v1
kind: Secret
metadata:
  name: crm-secrets
  namespace: crm-dev
type: Opaque
stringData:
  # IMPORTANT: Replace these placeholder values before deploying
  JWT_SECRET: "CHANGE_ME_GENERATE_SECURE_SECRET_AT_LEAST_32_CHARACTERS"
  JWT_ISSUER: "CRM.Api"
  JWT_AUDIENCE: "CRM.Frontend"
  DB_CONNECTION_STRING: "Server=crm-db;Port=3306;Database=crm_db;User=crm_user;Password=CHANGE_ME_DB_PASSWORD;SslMode=none;"
  MARIADB_ROOT_PASSWORD: "CHANGE_ME_ROOT_PASSWORD"
  MARIADB_PASSWORD: "CHANGE_ME_DB_PASSWORD"

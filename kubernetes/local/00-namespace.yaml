apiVersion: v1
kind: Namespace
metadata:
  name: crm-dev
  labels:
    app: crm
    name: crm-dev
---
# NOTE: crm-config ConfigMap is defined in ../00-namespace-config.yaml (source of truth).
# Local environment overrides (ASPNETCORE_ENVIRONMENT, DatabaseProvider, NODE_ENV,
# REACT_APP_API_URL) should be applied via a Kustomize patch or Helm values override
# rather than redefining the ConfigMap here, to avoid S6907 duplicate-key violations.
---
apiVersion: v1
kind: Secret
metadata:
  name: crm-secrets
  namespace: crm-dev
type: Opaque
stringData:
  # IMPORTANT: Replace these placeholder values before deploying
  JWT_SECRET: "CHANGE_ME_GENERATE_SECURE_SECRET_AT_LEAST_32_CHARACTERS"
  JWT_ISSUER: "CRM.Api"
  JWT_AUDIENCE: "CRM.Frontend"
  DB_CONNECTION_STRING: "Server=crm-db;Port=3306;Database=crm_db;User=crm_user;Password=CHANGE_ME_DB_PASSWORD;SslMode=none;"
  MARIADB_ROOT_PASSWORD: "CHANGE_ME_ROOT_PASSWORD"
  MARIADB_PASSWORD: "CHANGE_ME_DB_PASSWORD"

apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
  labels:
    name: external-secrets
---
# =============================================================================
# CRM Solution - External Secrets Operator (ESO) Configuration
#
# This manifest configures the External Secrets Operator to sync secrets from
# an external secret store (HashiCorp Vault, AWS Secrets Manager, Azure Key
# Vault, or GCP Secret Manager) into Kubernetes Secrets.
#
# Prerequisites:
#   1. Install ESO via Helm:
#      helm repo add external-secrets https://charts.external-secrets.io
#      helm install external-secrets external-secrets/external-secrets \
#        -n external-secrets --create-namespace
#
#   2. Configure your secret backend (choose ONE):
#      - HashiCorp Vault (self-hosted or HCP)
#      - AWS Secrets Manager
#      - Azure Key Vault
#      - GCP Secret Manager
#
# Usage:
#   kubectl apply -f kubernetes/05-external-secrets.yaml
# =============================================================================

# =============================================================================
# Option A: HashiCorp Vault SecretStore (self-hosted / recommended for on-prem)
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-secret-store
  namespace: crm-app
spec:
  provider:
    vault:
      server: "http://vault.vault-system.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "crm-app"
          serviceAccountRef:
            name: sa-crm-api
---
# =============================================================================
# Option B: AWS Secrets Manager SecretStore
# Uncomment this block and comment out the Vault block above to use AWS.
# =============================================================================
# apiVersion: external-secrets.io/v1beta1
# kind: SecretStore
# metadata:
#   name: aws-secret-store
#   namespace: crm-app
# spec:
#   provider:
#     aws:
#       service: SecretsManager
#       region: us-east-1
#       auth:
#         secretRef:
#           accessKeyIDSecretRef:
#             name: aws-credentials
#             key: access-key-id
#           secretAccessKeySecretRef:
#             name: aws-credentials
#             key: secret-access-key
---
# =============================================================================
# Option C: Azure Key Vault SecretStore
# Uncomment this block and comment out the Vault block above to use Azure.
# =============================================================================
# apiVersion: external-secrets.io/v1beta1
# kind: SecretStore
# metadata:
#   name: azure-secret-store
#   namespace: crm-app
# spec:
#   provider:
#     azurekv:
#       tenantId: "<AZURE_TENANT_ID>"
#       vaultUrl: "https://kv-crm-prod.vault.azure.net"
#       authSecretRef:
#         clientId:
#           name: azure-credentials
#           key: client-id
#         clientSecret:
#           name: azure-credentials
#           key: client-secret

# =============================================================================
# ExternalSecret: Database Credentials
# Syncs DB_PASSWORD and DB_ROOT_PASSWORD from the secret store
# into a Kubernetes Secret named "crm-db-secrets"
# =============================================================================
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: crm-db-secrets
  namespace: crm-app
  annotations:
    description: "Database credentials synced from external secret store"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-secret-store
    kind: SecretStore
  target:
    name: crm-db-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      engineVersion: v2
  data:
  - secretKey: DB_PASSWORD
    remoteRef:
      key: crm/database
      property: password
  - secretKey: DB_ROOT_PASSWORD
    remoteRef:
      key: crm/database
      property: root_password

# =============================================================================
# ExternalSecret: JWT Signing Key
# Syncs JWT_SECRET from the secret store
# =============================================================================
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: crm-jwt-secrets
  namespace: crm-app
  annotations:
    description: "JWT signing key synced from external secret store"
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault-secret-store
    kind: SecretStore
  target:
    name: crm-jwt-secrets
    creationPolicy: Owner
  data:
  - secretKey: JWT_SECRET
    remoteRef:
      key: crm/jwt
      property: secret

# =============================================================================
# ExternalSecret: SSL Certificate Password
# =============================================================================
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: crm-ssl-secrets
  namespace: crm-app
  annotations:
    description: "SSL certificate password synced from external secret store"
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault-secret-store
    kind: SecretStore
  target:
    name: crm-ssl-secrets
    creationPolicy: Owner
  data:
  - secretKey: SSL_CERT_PASSWORD
    remoteRef:
      key: crm/ssl
      property: cert_password

# =============================================================================
# ExternalSecret: API Provider Keys (AI, Search, Notifications, etc.)
# =============================================================================
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: crm-provider-secrets
  namespace: crm-app
  annotations:
    description: "External provider API keys synced from secret store"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-secret-store
    kind: SecretStore
  target:
    name: crm-provider-secrets
    creationPolicy: Owner
  data:
  - secretKey: OPENAI_API_KEY
    remoteRef:
      key: crm/providers
      property: openai_api_key
  - secretKey: MEILISEARCH_API_KEY
    remoteRef:
      key: crm/providers
      property: meilisearch_api_key
  - secretKey: SENDGRID_API_KEY
    remoteRef:
      key: crm/providers
      property: sendgrid_api_key
  - secretKey: TWILIO_AUTH_TOKEN
    remoteRef:
      key: crm/providers
      property: twilio_auth_token

# =============================================================================
# ExternalSecret: Redis Password (optional)
# =============================================================================
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: crm-redis-secrets
  namespace: crm-app
  annotations:
    description: "Redis credentials synced from external secret store"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-secret-store
    kind: SecretStore
  target:
    name: crm-redis-secrets
    creationPolicy: Owner
  data:
  - secretKey: REDIS_PASSWORD
    remoteRef:
      key: crm/redis
      property: password

# =============================================================================
# ExternalSecret: Admin User Credentials (initial seeding)
# =============================================================================
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: crm-admin-secrets
  namespace: crm-app
  annotations:
    description: "Admin user credentials for initial database seeding"
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault-secret-store
    kind: SecretStore
  target:
    name: crm-admin-secrets
    creationPolicy: Owner
  data:
  - secretKey: ADMIN_PASSWORD
    remoteRef:
      key: crm/admin
      property: password
  - secretKey: ADMIN_EMAIL
    remoteRef:
      key: crm/admin
      property: email

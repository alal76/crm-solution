# ==========================================================================
# CRM Solution — Primary CI Pipeline
#
# Runs tests, quality checks, and BVTs on every push/PR.
# Docker image builds and deployments are handled SEPARATELY by
# docker-build-deploy.yml, which is triggered via workflow_run after
# this pipeline completes successfully. Do NOT add Docker build/push
# steps here — they belong in docker-build-deploy.yml.
# ==========================================================================
name: CRM Solution - CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ==========================================================================
  # FRONTEND TESTS & BUILD
  # ==========================================================================
  frontend-tests:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: 'CRM.Frontend/package-lock.json'

    - name: Install dependencies
      working-directory: CRM.Frontend
      run: npm ci --legacy-peer-deps

    - name: Run TypeScript check
      working-directory: CRM.Frontend
      run: npx tsc --noEmit

    - name: Run linter
      working-directory: CRM.Frontend
      run: npm run lint --if-present
      continue-on-error: true

    - name: Run unit tests
      working-directory: CRM.Frontend
      run: npm run test:ci
      env:
        JEST_JUNIT_OUTPUT_DIR: ./test-results
        JEST_JUNIT_OUTPUT_NAME: frontend-tests.xml

    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      if: always()
      with:
        files: ./CRM.Frontend/coverage/coverage-final.json
        flags: frontend
        name: frontend-coverage
        token: ${{ secrets.CODECOV_TOKEN }}  # Optional — configure in repo Settings > Secrets
      continue-on-error: true

    - name: Upload frontend test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: frontend-test-results
        path: CRM.Frontend/test-results/
        retention-days: 7
      continue-on-error: true

    - name: Build production bundle
      working-directory: CRM.Frontend
      run: npm run build

    - name: Check bundle size
      working-directory: CRM.Frontend
      run: |
        SIZE=$(du -sh build/ | cut -f1)
        echo "Bundle size: $SIZE"
        if [ $(du -sb build/ | cut -f1) -gt 500000000 ]; then
          echo "❌ Bundle size exceeds 500MB limit"
          exit 1
        fi

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build-${{ matrix.node-version }}
        path: CRM.Frontend/build/
        retention-days: 7

  # ==========================================================================
  # BACKEND TESTS & BUILD
  #
  # All 4 test projects are in CRM.sln:
  #   - CRM.Tests.Unit.Core         (2,849 tests — entity/DTO unit tests)
  #   - CRM.Tests (root)            (3,489 tests — functional/provider/service tests)
  #   - CRM.Tests (subfolder)       (1,045 tests — additional service/integration tests)
  #   - CRM.SystemModule.Tests      (83 tests — system module tests)
  # ==========================================================================
  backend-tests:
    name: Backend Tests & Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore and build solution
      working-directory: CRM.Backend
      run: |
        dotnet restore CRM.sln
        dotnet build CRM.sln -c Release --no-restore

    # Core unit tests — entity/DTO tests (2,849 tests)
    - name: Run Core unit tests
      working-directory: CRM.Backend
      run: |
        dotnet test tests/Unit/Core/CRM.Tests.Unit.Core.csproj \
          -c Release --no-build \
          --logger "trx;LogFileName=core-unit-tests.trx" \
          --results-directory tests/TestResults/ \
          --settings tests/coverage.runsettings

    # Main test suite — functional/provider/service tests (3,489 tests)
    - name: Run Main test suite
      working-directory: CRM.Backend
      run: |
        dotnet test tests/CRM.Tests.csproj \
          -c Release --no-build \
          --filter "Category!=Integration" \
          --logger "trx;LogFileName=main-tests.trx" \
          --results-directory tests/TestResults/ \
          --settings tests/coverage.runsettings

    # Additional service/integration tests (1,045 tests)
    - name: Run Service & Integration tests
      working-directory: CRM.Backend
      run: |
        dotnet test tests/CRM.Tests/CRM.Tests.csproj \
          -c Release --no-build \
          --logger "trx;LogFileName=service-integration-tests.trx" \
          --results-directory tests/TestResults/ \
          --settings tests/coverage.runsettings

    # System module tests (83 tests)
    - name: Run System Module tests
      working-directory: CRM.Backend
      run: |
        dotnet test tests/CRM.SystemModule.Tests/CRM.SystemModule.Tests.csproj \
          -c Release --no-build \
          --logger "trx;LogFileName=system-module-tests.trx" \
          --results-directory tests/TestResults/ \
          --settings tests/coverage.runsettings

    - name: Generate coverage summary
      if: always()
      working-directory: CRM.Backend
      run: |
        # Find ALL Cobertura coverage files from the 4 test projects
        COVERAGE_FILES=$(find tests/TestResults -name "coverage.cobertura.xml" -type f 2>/dev/null)
        if [ -z "$COVERAGE_FILES" ]; then
          echo "⚠️ No coverage file found — skipping coverage summary"
          exit 0
        fi

        FILE_COUNT=$(echo "$COVERAGE_FILES" | wc -l | tr -d ' ')
        echo "Found ${FILE_COUNT} coverage file(s)"

        # Install ReportGenerator to merge multiple coverage reports
        dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.* 2>/dev/null || true
        export PATH="$PATH:$HOME/.dotnet/tools"

        # Merge all coverage files into a single Cobertura report
        MERGED_FILE="tests/TestResults/merged-coverage.cobertura.xml"
        reportgenerator \
          -reports:"tests/TestResults/**/coverage.cobertura.xml" \
          -targetdir:"tests/TestResults/merged" \
          -reporttypes:"Cobertura" \
          -verbosity:Warning

        if [ -f "tests/TestResults/merged/Cobertura.xml" ]; then
          cp "tests/TestResults/merged/Cobertura.xml" "$MERGED_FILE"
          echo "✅ Merged ${FILE_COUNT} coverage files into ${MERGED_FILE}"
        else
          echo "⚠️ Merge failed, falling back to first coverage file"
          MERGED_FILE=$(echo "$COVERAGE_FILES" | head -1)
        fi

        LINE_RATE=$(grep -o 'line-rate="[^"]*"' "$MERGED_FILE" | head -1 | sed 's/line-rate="//;s/"//')
        if [ -z "$LINE_RATE" ]; then
          echo "⚠️ Could not parse coverage rate"
          exit 0
        fi
        COVERAGE_PCT=$(echo "$LINE_RATE * 100" | bc -l | xargs printf "%.1f")
        echo "## 📊 Code Coverage: ${COVERAGE_PCT}% (merged from ${FILE_COUNT} reports)" >> $GITHUB_STEP_SUMMARY
        echo "Source: ${MERGED_FILE}" >> $GITHUB_STEP_SUMMARY
        echo "✅ Code coverage: ${COVERAGE_PCT}%"
        # Enforce minimum coverage threshold (raise this as coverage improves)
        THRESHOLD=30
        if (( $(echo "$COVERAGE_PCT < $THRESHOLD" | bc -l) )); then
          echo "❌ Coverage ${COVERAGE_PCT}% is below minimum threshold of ${THRESHOLD}%" >> $GITHUB_STEP_SUMMARY
          echo "❌ Coverage ${COVERAGE_PCT}% is below minimum threshold of ${THRESHOLD}%"
          exit 1
        fi
        echo "✅ Coverage ${COVERAGE_PCT}% meets minimum threshold of ${THRESHOLD}%" >> $GITHUB_STEP_SUMMARY

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: backend-test-results
        path: CRM.Backend/tests/TestResults/
        retention-days: 7

  # ==========================================================================
  # BVT (BUILD VERIFICATION TESTS)
  #
  # Playwright API-level BVTs against a live API + MariaDB.
  # 118 tests — fast, no-browser, verify all critical API endpoints.
  # ==========================================================================
  bvt-tests:
    name: BVT (Build Verification Tests)
    runs-on: ubuntu-latest
    needs: [backend-tests]

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: crm_db
          MARIADB_USER: crm_user
          MARIADB_PASSWORD: CrmPass_CI2024
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s
        ports:
          - 3306:3306

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Build API
      working-directory: CRM.Backend
      run: |
        dotnet restore CRM.sln
        dotnet build CRM.sln -c Release --no-restore

    - name: Start API server
      working-directory: CRM.Backend
      env:
        ASPNETCORE_ENVIRONMENT: Development
        ASPNETCORE_URLS: http://+:5000
        DatabaseProvider: mariadb
        ConnectionStrings__DefaultConnection: "Server=127.0.0.1;Port=3306;Database=crm_db;User=crm_user;Password=CrmPass_CI2024;"
        Jwt__Secret: "ThisIsAVeryLongSecureJwtSecretKeyForCIPipelineOnly123456789"
        Jwt__Issuer: CRM.Api
        Jwt__Audience: CRM.Client
        ADMIN_USERNAME: admin
        ADMIN_EMAIL: admin@crm.local
        ADMIN_PASSWORD: Admin@123
      run: |
        dotnet run --project src/CRM.Api/CRM.Api.csproj -c Release --no-build &
        API_PID=$!
        echo "API_PID=$API_PID" >> $GITHUB_ENV
        echo "Waiting for API to start..."
        for i in $(seq 1 60); do
          if curl -sf http://localhost:5000/health > /dev/null 2>&1; then
            echo "✅ API is healthy after ${i}s"
            break
          fi
          if [ $i -eq 60 ]; then
            echo "❌ API failed to start"
            exit 1
          fi
          sleep 2
        done

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'e2e-tests/package-lock.json'

    - name: Install Playwright
      working-directory: e2e-tests
      run: |
        npm ci
        npx playwright install --with-deps

    - name: Run BVT tests
      working-directory: e2e-tests
      env:
        BASE_URL: http://localhost:5000
        API_BASE_URL: http://localhost:5000
      run: npx playwright test --config=playwright.bvt.config.ts --reporter=list

    - name: Stop API server
      if: always()
      run: kill $API_PID 2>/dev/null || true

    - name: Upload BVT report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bvt-test-results
        path: e2e-tests/test-results/
        retention-days: 7

  # ==========================================================================
  # DOCKER BUILD — REMOVED (handled by docker-build-deploy.yml)
  #
  # The docker-build job was removed to avoid duplicate image builds.
  # After this CI pipeline succeeds, the "Build and Deploy" workflow
  # (.github/workflows/docker-build-deploy.yml) is triggered automatically
  # via workflow_run. That workflow handles:
  #   - Docker image builds with layer caching
  #   - Pushing to GHCR (ghcr.io)
  #   - Trivy vulnerability scanning
  #   - Kubernetes deployment (main branch only)
  # ==========================================================================

  # ==========================================================================
  # CODE QUALITY
  # ==========================================================================
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'CRM.Frontend/package-lock.json'

    - name: Install dependencies
      working-directory: CRM.Frontend
      run: npm ci --legacy-peer-deps

    - name: Run ESLint
      working-directory: CRM.Frontend
      run: npx eslint src --max-warnings 50
      continue-on-error: true

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Run StyleCop analysis
      working-directory: CRM.Backend
      run: |
        dotnet restore CRM.sln
        dotnet build CRM.sln -c Debug -warnaserror:SA0001 2>&1 | tee build-output.log
        WARNING_COUNT=$(grep -c ' warning SA' build-output.log || true)
        echo "## StyleCop Warnings: $WARNING_COUNT" >> $GITHUB_STEP_SUMMARY
        if [ "$WARNING_COUNT" -gt 500 ]; then
          echo "❌ StyleCop warnings ($WARNING_COUNT) exceed threshold of 500"
          exit 1
        fi
        echo "✅ StyleCop warnings ($WARNING_COUNT) within threshold"
      continue-on-error: true

  # ==========================================================================
  # SECURITY SCAN
  # ==========================================================================
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Run npm audit
      working-directory: CRM.Frontend
      run: npm audit --audit-level=high || true

    - name: Run .NET security scan
      working-directory: CRM.Backend
      run: |
        dotnet restore CRM.sln
        dotnet list src/CRM.Api/CRM.Api.csproj package --vulnerable --include-transitive 2>&1 | tee vulnerability-report.txt
        echo "## .NET Vulnerability Report" >> $GITHUB_STEP_SUMMARY
        cat vulnerability-report.txt >> $GITHUB_STEP_SUMMARY
      continue-on-error: true

  # ==========================================================================
  # TEST REPORT
  # ==========================================================================
  test-report:
    name: Generate Test Report
    runs-on: ubuntu-latest
    needs: [frontend-tests, backend-tests, bvt-tests]
    if: always()

    steps:
    - name: Download backend test results
      uses: actions/download-artifact@v4
      if: always()
      with:
        name: backend-test-results
        path: backend-results/
      continue-on-error: true

    - name: Download frontend test results
      uses: actions/download-artifact@v4
      if: always()
      with:
        name: frontend-test-results
        path: frontend-results/
      continue-on-error: true

    - name: Download BVT test results
      uses: actions/download-artifact@v4
      if: always()
      with:
        name: bvt-test-results
        path: bvt-results/
      continue-on-error: true

    - name: Publish test results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      continue-on-error: true
      with:
        files: |
          backend-results/**/*.trx
          frontend-results/**/*.xml
        check_name: Test Results
        comment_title: Test Summary
        action_fail_on_inconclusive: false

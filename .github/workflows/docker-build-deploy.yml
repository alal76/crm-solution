name: Build and Deploy

on:
  # Triggered after CI pipeline passes — avoids duplicate test runs
  # See .github/workflows/ci-cd.yml for the primary test workflow
  workflow_run:
    workflows: ["CRM Solution - CI/CD Pipeline"]
    types: [completed]
    branches: [main, develop]
  # Allow manual trigger for emergency deployments
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_API: ${{ github.repository }}/crm-api
  IMAGE_NAME_FRONTEND: ${{ github.repository }}/crm-frontend

jobs:
  build:
    runs-on: ubuntu-latest
    # Only proceed if the CI pipeline succeeded (or manual trigger)
    if: >-
      github.event.workflow_run.conclusion == 'success' ||
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.workflow_run.head_sha || github.sha }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (backend)
      id: meta-api
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha

    - name: Extract metadata (frontend)
      id: meta-frontend
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha

    - name: Build and push backend image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./docker/Dockerfile.backend
        push: true
        tags: ${{ steps.meta-api.outputs.tags }}
        labels: ${{ steps.meta-api.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push frontend image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./docker/Dockerfile.frontend
        push: true
        tags: ${{ steps.meta-frontend.outputs.tags }}
        labels: ${{ steps.meta-frontend.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # ================================================================
    # CONTAINER VULNERABILITY SCANNING
    # ================================================================
    - name: Run Trivy vulnerability scanner (API)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}:${{ github.event.workflow_run.head_branch || github.ref_name }}'
        format: 'table'
        exit-code: '0'  # Don't fail build yet, just report
        severity: 'CRITICAL,HIGH'
      continue-on-error: true
      # Set exit-code to '1' to fail builds on CRITICAL vulnerabilities

    - name: Run Trivy vulnerability scanner (Frontend)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ github.event.workflow_run.head_branch || github.ref_name }}'
        format: 'table'
        exit-code: '0'  # Don't fail build yet, just report
        severity: 'CRITICAL,HIGH'
      continue-on-error: true
      # Set exit-code to '1' to fail builds on CRITICAL vulnerabilities

  # ==========================================================================
  # TESTING: Handled by ci-cd.yml workflow
  # ==========================================================================
  # The ci-cd.yml workflow runs all test suites (Core, Services, Main, BVT,
  # Frontend) on the same push/PR triggers. Test jobs were removed from this
  # workflow to eliminate duplicate test runs.
  # See .github/workflows/README.md for details.
  # ==========================================================================

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    # Deploy only when main branch CI passes — skipped if KUBE_CONFIG secret not configured
    if: >-
      (github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    continue-on-error: true
    
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.workflow_run.head_sha || github.sha }}
    
    - name: Set up kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: 'v1.29.0'
    
    - name: Configure kubectl
      env:
        KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
      run: |
        if [ -z "$KUBE_CONFIG" ]; then
          echo "⚠️ KUBE_CONFIG secret is not configured. Skipping deployment."
          echo "To enable deployment, add a KUBE_CONFIG secret in repository settings."
          exit 0
        fi
        mkdir -p $HOME/.kube
        echo "$KUBE_CONFIG" | base64 -d > $HOME/.kube/config
        chmod 600 $HOME/.kube/config
    
    - name: Deploy to Kubernetes
      env:
        KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
      run: |
        if [ -z "$KUBE_CONFIG" ]; then
          echo "Deployment skipped - no KUBE_CONFIG configured"
          exit 0
        fi
        kubectl apply -f kubernetes/00-namespace-config.yaml
        kubectl apply -f kubernetes/01-database-tier.yaml
        kubectl apply -f kubernetes/02-application-tier.yaml
        kubectl apply -f kubernetes/03-presentation-tier.yaml
        kubectl apply -f kubernetes/04-ingress-network.yaml
        kubectl rollout status deployment/crm-api -n crm-dev --timeout=5m
        kubectl rollout status deployment/crm-frontend -n crm-dev --timeout=5m

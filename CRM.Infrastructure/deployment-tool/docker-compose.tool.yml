# ============================================================
# CRM Deployment Tool (CDT) — Standalone Docker Compose
# Usage: docker-compose -f docker-compose.tool.yml up
# ============================================================
# Opens the wizard at http://localhost:5050
# ============================================================

version: "3.9"

services:
  crm-cdt:
    build:
      context: .
      dockerfile: Dockerfile.tool
      args:
        KUBECTL_VERSION: v1.31.4
        HELM_VERSION:    v3.17.0
    image: crm-cdt:latest
    container_name: crm-cdt
    restart: unless-stopped

    ports:
      - "${CDT_PORT:-5050}:5050"

    environment:
      # Runtime settings (override in .env or with -e)
      CDT_NO_BROWSER: "true"
      CDT_PORT: "5050"
      PYTHONUNBUFFERED: "1"

      # Pass through host Docker credentials if needed
      DOCKER_HOST: "${DOCKER_HOST:-}"

    volumes:
      # Docker socket — lets CDT manage host containers (on-prem workflows)
      - /var/run/docker.sock:/var/run/docker.sock

      # Kubeconfig — lets CDT run kubectl against your cluster
      - ${KUBECONFIG:-~/.kube}:/root/.kube:ro

      # SSH keys — lets CDT connect to remote servers for on-prem deployments
      - ${SSH_DIR:-~/.ssh}:/root/.ssh:ro

      # Single persistent data volume covering ALL CDT state:
      #   profiles, history.db, secrets, generated files, snapshots, configs.
      # The Dockerfile symlinks /root/.crm-cdt → /app/data so every
      # code path (ProfileManager, VaultManager, history DB) writes here.
      - cdt-data:/app/data

      # Logs
      - cdt-logs:/app/logs

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

    labels:
      com.crm.service: "deployment-tool"
      com.crm.version: "0.611.0"

volumes:
  cdt-data:
    name: crm-cdt-data
  cdt-logs:
    name: crm-cdt-logs

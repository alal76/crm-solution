[pytest]
# ---------------------------------------------------------------------------
# CDT (Configuration & Deployment Tool) — Pytest Configuration
# ---------------------------------------------------------------------------
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Custom markers for categorisation
markers =
    unit: Pure unit tests (mocked dependencies, no I/O)
    integration: Integration tests (Flask test client, temp files)
    ui: UI/template validation tests

# Default options: colour, short tracebacks, HTML report
addopts =
    --tb=short
    --strict-markers
    -q
    --html=test-reports/cdt-test-report.html
    --self-contained-html

# Console output
console_output_style = progress

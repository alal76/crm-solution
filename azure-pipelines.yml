# CRM Solution - Azure DevOps CI/CD Pipeline
# Version: 1.0.0
# Triggers on main and dev branches

trigger:
  branches:
    include:
      - main
      - dev
  paths:
    exclude:
      - '*.md'
      - 'docs/**'

pr:
  branches:
    include:
      - main
      - dev

variables:
  # Azure Container Registry
  azureContainerRegistry: 'crmacr'
  azureSubscription: 'Azure-CRM-ServiceConnection'
  
  # Image names
  backendImageName: 'crm-api'
  frontendImageName: 'crm-frontend'
  
  # Build configuration
  buildConfiguration: 'Release'
  dotnetVersion: '8.0.x'
  nodeVersion: '20.x'
  
  # Resource Group
  resourceGroup: 'crm-solution-rg'
  location: 'eastus'

stages:
  # ============================================================
  # STAGE 1: BUILD AND TEST
  # ============================================================
  - stage: Build
    displayName: 'Build & Test'
    jobs:
      # Backend Build Job
      - job: BuildBackend
        displayName: 'Build .NET Backend'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UseDotNet@2
            displayName: 'Install .NET SDK'
            inputs:
              version: $(dotnetVersion)
              
          - task: DotNetCoreCLI@2
            displayName: 'Restore NuGet packages'
            inputs:
              command: 'restore'
              projects: 'CRM.Backend/CRM.sln'
              
          - task: DotNetCoreCLI@2
            displayName: 'Build Solution'
            inputs:
              command: 'build'
              projects: 'CRM.Backend/CRM.sln'
              arguments: '--configuration $(buildConfiguration) --no-restore'
              
          - task: DotNetCoreCLI@2
            displayName: 'Run Unit Tests'
            inputs:
              command: 'test'
              projects: 'CRM.Backend/tests/CRM.Tests.csproj'
              arguments: '--configuration $(buildConfiguration) --no-build --filter "Category!=Integration&Category!=DatabaseSchema" --logger trx --results-directory $(Build.ArtifactStagingDirectory)/TestResults'
              
          - task: PublishTestResults@2
            displayName: 'Publish Test Results'
            inputs:
              testResultsFormat: 'VSTest'
              testResultsFiles: '$(Build.ArtifactStagingDirectory)/TestResults/*.trx'
              
          - task: DotNetCoreCLI@2
            displayName: 'Publish API'
            inputs:
              command: 'publish'
              projects: 'CRM.Backend/src/CRM.Api/CRM.Api.csproj'
              arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/backend'
              
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Backend Artifact'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/backend'
              ArtifactName: 'backend'
              
      # Frontend Build Job
      - job: BuildFrontend
        displayName: 'Build React Frontend'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: NodeTool@0
            displayName: 'Install Node.js'
            inputs:
              versionSpec: $(nodeVersion)
              
          - script: |
              cd CRM.Frontend
              npm ci
            displayName: 'Install npm packages'
            
          - script: |
              cd CRM.Frontend
              npm run build
            displayName: 'Build React App'
            env:
              REACT_APP_API_URL: $(API_URL)
              
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Frontend Artifact'
            inputs:
              PathtoPublish: 'CRM.Frontend/build'
              ArtifactName: 'frontend'

  # ============================================================
  # STAGE 2: BUILD DOCKER IMAGES
  # ============================================================
  - stage: Docker
    displayName: 'Build Docker Images'
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: BuildImages
        displayName: 'Build & Push Images'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: Docker@2
            displayName: 'Build Backend Image'
            inputs:
              containerRegistry: $(azureContainerRegistry)
              repository: $(backendImageName)
              command: 'build'
              Dockerfile: 'docker/Dockerfile.backend'
              buildContext: '.'
              tags: |
                $(Build.BuildId)
                latest
                
          - task: Docker@2
            displayName: 'Push Backend Image'
            inputs:
              containerRegistry: $(azureContainerRegistry)
              repository: $(backendImageName)
              command: 'push'
              tags: |
                $(Build.BuildId)
                latest
                
          - task: Docker@2
            displayName: 'Build Frontend Image'
            inputs:
              containerRegistry: $(azureContainerRegistry)
              repository: $(frontendImageName)
              command: 'build'
              Dockerfile: 'docker/Dockerfile.frontend'
              buildContext: '.'
              tags: |
                $(Build.BuildId)
                latest
                
          - task: Docker@2
            displayName: 'Push Frontend Image'
            inputs:
              containerRegistry: $(azureContainerRegistry)
              repository: $(frontendImageName)
              command: 'push'
              tags: |
                $(Build.BuildId)
                latest

  # ============================================================
  # STAGE 3: DEPLOY TO STAGING
  # ============================================================
  - stage: DeployStaging
    displayName: 'Deploy to Staging'
    dependsOn: Docker
    condition: succeeded()
    jobs:
      - deployment: DeployStaging
        displayName: 'Deploy to Staging Environment'
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'staging'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebAppContainer@1
                  displayName: 'Deploy Backend to Staging'
                  inputs:
                    azureSubscription: $(azureSubscription)
                    appName: 'crm-api-staging'
                    containers: '$(azureContainerRegistry).azurecr.io/$(backendImageName):$(Build.BuildId)'
                    
                - task: AzureWebAppContainer@1
                  displayName: 'Deploy Frontend to Staging'
                  inputs:
                    azureSubscription: $(azureSubscription)
                    appName: 'crm-frontend-staging'
                    containers: '$(azureContainerRegistry).azurecr.io/$(frontendImageName):$(Build.BuildId)'

  # ============================================================
  # STAGE 4: DEPLOY TO PRODUCTION
  # ============================================================
  - stage: DeployProduction
    displayName: 'Deploy to Production'
    dependsOn: DeployStaging
    condition: succeeded()
    jobs:
      - deployment: DeployProduction
        displayName: 'Deploy to Production Environment'
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebAppContainer@1
                  displayName: 'Deploy Backend to Production'
                  inputs:
                    azureSubscription: $(azureSubscription)
                    appName: 'crm-api-prod'
                    containers: '$(azureContainerRegistry).azurecr.io/$(backendImageName):$(Build.BuildId)'
                    
                - task: AzureWebAppContainer@1
                  displayName: 'Deploy Frontend to Production'
                  inputs:
                    azureSubscription: $(azureSubscription)
                    appName: 'crm-frontend-prod'
                    containers: '$(azureContainerRegistry).azurecr.io/$(frontendImageName):$(Build.BuildId)'

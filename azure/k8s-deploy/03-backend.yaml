# =============================================================================
# CRM Solution - Backend API Deployment
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm-api
  namespace: crm
  labels:
    app: crm-api
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crm-api
  template:
    metadata:
      labels:
        app: crm-api
        tier: backend
    spec:
      automountServiceAccountToken: false
      containers:
        - name: crm-api
          image: crmdevacrdev.azurecr.io/crm-backend:v2
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: crm-config
            - secretRef:
                name: crm-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
              ephemeral-storage: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: data-volume
              mountPath: /app/data
      volumes:
        - name: data-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: crm-api-service
  namespace: crm
spec:
  selector:
    app: crm-api
  ports:
    - port: 80
      targetPort: 5000
  type: ClusterIP

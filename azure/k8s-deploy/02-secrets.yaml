# =============================================================================
# CRM Solution - Secrets for Azure Deployment
# Note: In production, use Azure Key Vault with CSI driver
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: crm-secrets
  namespace: crm
type: Opaque
stringData:
  # Database connection - Using in-cluster MySQL
  ConnectionStrings__DefaultConnection: "Server=mysql;Database=crm_db;User=crmadmin;Password=CrmDev2026Pass1;SslMode=None;"
  # JWT Configuration
  Jwt__Secret: "YourSuperSecretKeyForJWTTokensThatIsAtLeast64CharactersLongForSecurityPurposes2026"
  Jwt__Issuer: "CRM-Solution"
  Jwt__Audience: "CRM-Users"
  Jwt__ExpirationMinutes: "60"

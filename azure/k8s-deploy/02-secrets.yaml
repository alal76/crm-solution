# =============================================================================
# CRM Solution - Secrets for Azure Deployment
# Note: In production, use Azure Key Vault with CSI driver
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: crm-secrets
  namespace: crm
type: Opaque
stringData:
  # Database connection - Using in-cluster MySQL
  # IMPORTANT: Replace PLACEHOLDER values before deployment using:
  #   kubectl create secret generic crm-secrets --from-literal=... -n crm
  ConnectionStrings__DefaultConnection: "Server=mysql;Database=crm_db;User=crmadmin;Password=CHANGE_ME_BEFORE_DEPLOY;SslMode=None;" # NOSONAR - placeholder, must be overridden
  # JWT Configuration
  Jwt__Secret: "CHANGE_ME_GENERATE_SECURE_KEY_AT_LEAST_64_CHARS" # NOSONAR - placeholder, must be overridden
  Jwt__Issuer: "CRM-Solution"
  Jwt__Audience: "CRM-Users"
  Jwt__ExpirationMinutes: "60"

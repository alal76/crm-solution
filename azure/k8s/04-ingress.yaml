# =============================================================================
# CRM Solution - Ingress Controller
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crm-ingress
  namespace: crm
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - ${DOMAIN_NAME}
        - api.${DOMAIN_NAME}
      secretName: crm-tls-secret
  rules:
    # Frontend
    - host: ${DOMAIN_NAME}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: crm-frontend-service
                port:
                  number: 80
    # API
    - host: api.${DOMAIN_NAME}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: crm-api-service
                port:
                  number: 80
---
# For development without custom domain - use LoadBalancer
apiVersion: v1
kind: Service
metadata:
  name: crm-api-lb
  namespace: crm
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "false"
spec:
  type: LoadBalancer
  selector:
    app: crm-api
  ports:
    - port: 80
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: crm-frontend-lb
  namespace: crm
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "false"
spec:
  type: LoadBalancer
  selector:
    app: crm-frontend
  ports:
    - port: 80
      targetPort: 80
